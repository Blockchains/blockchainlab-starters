version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/starters/circom-zk-proof"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/starters/hedera-token-sdk"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/starters/wagmi-rainbowkit-dapp"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
