name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundry:
    name: foundry / ${{ matrix.starter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [foundry-oz-tokens, chainlink-price-feed, uniswap-v4-hook, erc4337-smart-account]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build + test
        working-directory: starters/${{ matrix.starter }}
        run: |
          forge --version
          forge build --sizes
          forge test -vv
  node:
    name: node / ${{ matrix.starter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [hedera-token-sdk, wagmi-rainbowkit-dapp, ipfs-upload, ai-agent-onchain, farcaster-miniapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: starters/${{ matrix.starter }}
        run: |
          npm ci
          npm test
          if npm run | grep -q " build"; then npm run build; fi
  ccip-crosschain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci + forge test (Chainlink Local simulator + live Sepolia fork quote)
        working-directory: starters/ccip-crosschain
        run: |
          npm ci --no-audit --no-fund
          forge build --sizes
          forge test -vv
  subgraph-indexer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: graph codegen + build + Matchstick + live data-source check
        working-directory: starters/subgraph-indexer
        run: |
          sudo apt-get install -y -q libpq5 >/dev/null
          npm ci --no-audit --no-fund
          npm test
  solana-anchor-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
            starters/solana-anchor-vault/target
            ~/.cargo/registry
          key: anchor-0.32.1-agave-2.3.13-${{ hashFiles('starters/solana-anchor-vault/Cargo.lock') }}
      - name: Install Agave (Solana) 2.3.13 + Anchor 0.32.1 (release binary)
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.13/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.local/bin && curl -sSfL -o ~/.local/bin/anchor https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu
          chmod +x ~/.local/bin/anchor && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: anchor build + test (local validator, mocha)
        working-directory: starters/solana-anchor-vault
        run: |
          solana --version && anchor --version
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json --force >/dev/null
          npm ci --no-audit --no-fund
          anchor keys sync
          anchor test
  circom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install circom v2.2.3
        run: |
          curl -sSfL -o /usr/local/bin/circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version
      - working-directory: starters/circom-zk-proof
        run: |
          npm ci
          npm test
  noir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: stable
      - working-directory: starters/noir-zk-proof
        run: |
          nargo --version
          nargo test
          nargo execute
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
