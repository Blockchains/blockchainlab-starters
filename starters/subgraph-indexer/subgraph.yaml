specVersion: 1.2.0
description: ERC-20 transfers and balances (USDC on Base by default) - Blockchain Lab subgraph starter
repository: https://github.com/Blockchains/blockchainlab-starters/tree/main/starters/subgraph-indexer
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Token
    network: base
    source:
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      abi: ERC20
      startBlock: 52175318
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
        - Account
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
